version: 2

updates:
  - package-ecosystem: npm
    directory: /claude_code/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The server types against the Agent SDK's .d.ts, so a bump here can break
      # the build. CI now catches that on the pull request.
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
